name: CI

on: [push]

jobs:
  checks:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install -r requirements.txt
      - run: black --check .
      - run: ruff check .
      - run: pytest